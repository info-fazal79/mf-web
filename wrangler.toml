# Cloudflare Workers (static assets) — built by Workers Builds from this repo.
# Build: npm run build  →  Astro writes the site to ./dist
name = "mf-web"
compatibility_date = "2024-09-23"
# Small worker for campaign share links (/s/...). Every other URL is served
# straight from ./dist as before (the worker is only run first for /s/*).
main = "worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
# Multi-page Astro site with its own 404 page (src/pages/404.astro → dist/404.html).
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/s/*"]

# Public values (the same ones the site's own JavaScript already uses).
# The campaign secret is NOT here: add it in Cloudflare as a Secret named
# NUSUK_CAMP_SECRET (Workers → mf-web → Settings → Variables and Secrets).
[vars]
SUPABASE_URL = "https://mbdmdswemppcinhvjyti.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_2WwQJgBYHLBtGAm2VatAMQ_7oxV8RN3"
